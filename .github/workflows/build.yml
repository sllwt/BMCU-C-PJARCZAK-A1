name: 自动编译固件

# 触发条件：当您推送代码到任何分支时自动运行
on: [push, pull_request]

jobs:
  build:                    # 注意这里需要缩进2空格
    name: 编译所有固件
    runs-on: ubuntu-latest

    steps:
      # 1. 下载你的代码
      - name: 拉取代码
        uses: actions/checkout@v4

      # 2. 设置Python环境
      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. 安装PlatformIO
      - name: 安装PlatformIO
        run: pip install platformio

      # 4. 执行编译脚本
      - name: 执行编译脚本
        run: |
          chmod +x build_all_firmwares.sh
          ./build_all_firmwares.sh

      # 5. 上传编译好的固件文件
      - name: uplaodfirmwares
        uses: actions/upload-artifact@v4
        with:
          name: firmwares-${{ github.sha }}  # 修正变量语法
          path: firmwares/
          if-no-files-found: error
          retention-days: 30

  build_auth_proxy:
    name: 编译认证代理测试固件
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 缓存PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-ch32v-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            platformio-ch32v-${{ runner.os }}-

      - name: 安装PlatformIO
        run: pip install platformio

      - name: 编译AMS08认证代理
        run: pio run -e a1_auth_proxy

      - name: 编译AMS2 Pro认证代理
        run: pio run -e a1_auth_proxy_ams2

      - name: 整理固件
        run: |
          mkdir -p auth-proxy-firmwares
          cp .pio/build/a1_auth_proxy/firmware.bin \
             auth-proxy-firmwares/a1_auth_proxy_AMS08_10.50.00.00.bin
          cp .pio/build/a1_auth_proxy_ams2/firmware.bin \
             auth-proxy-firmwares/a1_auth_proxy_AMS2Pro_90.00.00.00.bin

      - name: 上传认证代理固件
        uses: actions/upload-artifact@v4
        with:
          name: auth-proxy-firmwares-${{ github.sha }}
          path: auth-proxy-firmwares/
          if-no-files-found: error
          retention-days: 30
